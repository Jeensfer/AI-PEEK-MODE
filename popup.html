<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 250px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; color: #202124; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; cursor: pointer; }
  small { display: block; opacity: .6; font-size: 11px; margin-top: 8px; }
  input { appearance: none; width: 34px; height: 18px; border-radius: 9px; background: #bbb; position: relative; cursor: pointer; transition: .15s; flex: none; }
  input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .15s; }
  input:checked { background: #1a73e8; }
  input:checked::after { left: 18px; }
  @media (prefers-color-scheme: dark) { body { background: #202124; color: #eee; } }
</style>
<h1>AI Mode Peek</h1>
<label>Enabled <input type="checkbox" id="enabled"></label>
<label>Open instantly on select <input type="checkbox" id="instant"></label>
<label>Close when I click away <input type="checkbox" id="closeOnBlur"></label>
<small>Instant off = a 🔍 bubble appears; click it. Shortcut: Alt+S.</small>
<script src="popup.js"></script>
